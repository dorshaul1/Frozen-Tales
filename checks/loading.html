<meta charset="utf-8"><pre id="results"></pre><section id="boot-screen"><span id="boot-status"></span><div><div id="boot-progress"></div></div><button id="boot-retry" hidden>Retry</button></section><script type="module">
import {beginLoading,finishLoading,loadingFailed} from '/src/game/boot/loading.ts';
const out=document.querySelector('#results'),screen=document.querySelector('#boot-screen');
function check(v,label){out.textContent+=(v?'PASS ':'FAIL ')+label+'\n';if(!v)throw Error(label)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
beginLoading();finishLoading();check(!screen.hidden&&document.body.classList.contains('loading'),'Fast loads remain covered');await wait(500);check(!screen.classList.contains('leaving'),'Minimum display duration');await wait(1000);check(screen.hidden&&!document.body.classList.contains('loading'),'Ready screen fades away');
beginLoading();loadingFailed();finishLoading();await wait(1400);check(!screen.hidden&&document.body.classList.contains('loading'),'Failure never exposes unfinished world');check(!document.querySelector('#boot-retry').hidden,'Failure offers retry');
beginLoading();finishLoading();beginLoading();await wait(1400);check(!screen.hidden,'Stale completion cannot dismiss a new loading cycle');finishLoading();await wait(500);check(screen.hidden,'Subsequent readiness dismisses loading');
</script>
